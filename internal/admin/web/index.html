<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gola Bootlace</title>
<link rel="icon" type="image/svg+xml" href="/admin/mark.svg">
<style>
:root{
  --bg:#f4f5f6; --panel:#ffffff; --panel2:#f0f1f3; --line:#d9dce0; --text:#1b1d20; --muted:#5b616b;
  --accent:#c10016; --accent-text:#ffffff; --accent-soft:#fbe9ec; --ok:#17794a; --ok-soft:#e3f4ea; --warn:#8a5a00; --warn-soft:#fff3d6; --bad:#b3261e;
  --focus:#1a5fd0; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181b; --panel:#1f2124; --panel2:#272a2e; --line:#33373c; --text:#eceef0; --muted:#a2a8b0;
  --accent:#e0243a; --accent-text:#ffffff; --accent-soft:#3a1d22; --ok:#4cc98a; --ok-soft:#15301f; --warn:#f0b84a; --warn-soft:#352a0f; --bad:#ff7b72;
  --focus:#7aa7ff; --shadow:none}}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2124; --panel2:#272a2e; --line:#33373c; --text:#eceef0; --muted:#a2a8b0;
  --accent:#e0243a; --accent-text:#ffffff; --accent-soft:#3a1d22; --ok:#4cc98a; --ok-soft:#15301f; --warn:#f0b84a; --warn-soft:#352a0f; --bad:#ff7b72;
  --focus:#7aa7ff; --shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button,input,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand img{width:32px;height:32px}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:9px 13px;min-height:44px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tools{display:flex;gap:6px}
.icon{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
.icon:hover{background:var(--panel2)}
main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.red{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn:hover{background:var(--panel2)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{min-height:36px;padding:4px 12px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
label{display:block;font-weight:600;margin:0 0 4px}
input[type=text],input[type=search],input[type=password],input[type=number],select{width:100%;min-height:44px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);}
input[type=text].inline,input[type=search].inline,select.inline{min-height:38px;padding:5px 9px}
.field{margin:0 0 14px;max-width:560px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.login{max-width:380px;margin:12vh auto 0}
.login .brand{justify-content:center;margin-bottom:16px;font-size:20px}
.err{color:var(--bad);min-height:22px;margin:8px 0 0}
.bad{color:var(--bad)}
.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;max-width:90vw;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
.log{background:#0e1012;color:#d5d9de;border-radius:10px;padding:10px 12px;height:60vh;min-height:280px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.log .t{color:#6f7782}.log .k-dhcp{color:#7fb4ff}.log .k-tftp{color:#c3a3ff}.log .k-smb{color:#79d7c4}.log .k-menu{color:#ffd37a}.log .k-web{color:#ff9aa5}
.menu-preview{container-type:inline-size;position:relative;aspect-ratio:4/3;background:#0c0d0f url(/bg.png) center/100% 100% no-repeat;color:#e8e9ec;border-radius:6px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:1.56cqw;line-height:1.25;max-width:640px}
.menu-preview .in{position:absolute;left:6.25%;right:6.25%;top:35.2%;bottom:5%;overflow:hidden}
.menu-preview .h{font-weight:700;margin-bottom:1.2em}
.menu-preview .sel{background:#c10016;color:#fff;margin:0 -.6em;padding:0 .6em}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.banner.bad{background:var(--accent-soft);color:var(--accent)}
.banner a{color:inherit}
.banner .btn{margin-left:6px}
fieldset.seg{border:0;padding:0;margin:0 0 12px;min-width:0}
fieldset.seg legend{font-weight:600;padding:0;margin:0 0 4px}
.seg .opts{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg label{position:relative;margin:0;font-weight:600;cursor:pointer}
.seg label + label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;padding:10px 16px;min-height:44px;line-height:24px}
.seg input:checked + span{background:var(--accent);color:var(--accent-text)}
.seg input:focus-visible + span{outline:3px solid var(--focus);outline-offset:-3px}
.seg input:disabled{cursor:default}
.seg input:disabled + span{opacity:.6}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);color:var(--text);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal h2{font-size:18px}
.dirs{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;margin:10px 0}
.dirs button{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;min-height:44px;cursor:pointer}
.dirs button:last-child{border-bottom:0}
.dirs button:hover{background:var(--panel2)}
.bar2{height:8px;background:var(--panel2);border-radius:4px;margin:6px 0 2px;overflow:hidden}.bar2>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
button.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.steps{margin:0;padding-left:20px}
.steps li{margin:4px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
footer{max-width:1120px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12px}
td.k{color:var(--muted);white-space:nowrap}
@media (max-width:640px){
  .bar{padding:8px 12px;gap:8px}
  nav{order:3;flex-basis:100%}
  h1{font-size:20px}
  table.rt thead{display:none}
  table.rt tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{display:block;border:0;padding:4px 6px}
  table.rt td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  table.rt td.hide-s{display:block}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { setupDone: undefined, libPath: "", polling: false, view: "dash", isos: [], defaultAction: "", pcs: [], status: null, settings: null, logLast: 0, logLines: [], timers: [], authed: false, version: "" };
const views = [["dash", "Dashboard"], ["server", "Server"], ["library", "Library"], ["isos", "ISOs"], ["answers", "Unattended"], ["pcs", "PCs"], ["menu", "Menu"], ["log", "Log"], ["account", "Account"]];

async function api(path, method = "GET", body) {
  const opt = { method, headers: { "X-Bootlace": "1" }, credentials: "same-origin" };
  if (state.polling && method === "GET") opt.headers["X-Bootlace-Poll"] = "1"; // the page refreshing itself does not keep the login alive
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  let data = {};
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (res.status === 401 && path !== "/api/login") { state.authed = false; render(); throw new Error("log in again"); }
  if (!res.ok) { const e = new Error(data.error || ("error " + res.status)); e.status = res.status; e.data = data; throw e; }
  return data;
}

let toastTimer;
function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 2600);
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { if (e !== staleView) toast(e.message, true); } };

function ago(iso) {
  if (!iso || iso.startsWith("0001")) return "never";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function bytes(n) { return n >= 2 ** 30 ? (n / 2 ** 30).toFixed(1) + " GB" : n >= 2 ** 20 ? Math.round(n / 2 ** 20) + " MB" : Math.round(n / 1024) + " KB"; }
function uptime(s) { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`; }
function actionLabel(a) {
  if (!a || a === "menu") return "Show the menu";
  if (a === "local") return "Own disk";
  if (a.startsWith("iso:")) { const i = state.isos.find(x => x.id === a.slice(4)); return i ? i.title : "(missing ISO)"; }
  if (a.startsWith("native:")) { const i = state.isos.find(x => x.id === a.slice(7)); return i ? i.title + " (Secure Boot)" : "(missing ISO)"; }
  return a;
}
function actionOptions(sel, withMenu = true) {
  let o = withMenu ? `<option value="menu"${sel === "menu" || !sel ? " selected" : ""}>Show the menu</option>` : "";
  o += `<option value="local"${sel === "local" ? " selected" : ""}>Boot from its own disk</option>`;
  o += state.isos.map(i => `<option value="iso:${i.id}"${sel === "iso:" + i.id ? " selected" : ""}>Start ${esc(i.title)}</option>`).join("");
  // Windows set-up can also be started by the PC's own firmware, which works with UEFI Secure Boot on (the rule is used up at the PC's next network boot)
  o += state.isos.filter(i => i.family === "Windows setup" || i.family === "Ubuntu (casper)").map(i => `<option value="native:${i.id}"${sel === "native:" + i.id ? " selected" : ""}>${i.family === "Windows setup" ? "Install" : "Start"} ${esc(i.title)}, once (works with Secure Boot)</option>`).join("");
  return o;
}

// Each render owns a distinct main element, even when returning to the same view.
// Drop late reads and failures before their continuations touch the next page.
// Mutations already sent to the server are allowed to finish; uploads stay global.
const staleView = new Error("view no longer active");
function viewScope(page) {
  const current = () => document.querySelector("#page") === page;
  const request = async (...args) => {
    if (!current()) throw staleView;
    try {
      const result = await api(...args);
      if (!current()) throw staleView;
      return result;
    } catch (e) {
      if (!current()) throw staleView;
      throw e;
    }
  };
  const repeat = (ms, fn) => {
    if (!current()) return;
    every(ms, async () => { if (current()) await fn(); });
  };
  return { request, repeat, current };
}

// ---- shell
function clearTimers() { state.timers.forEach(clearInterval); state.timers = []; }
function every(ms, fn) { state.timers.push(setInterval(() => { state.polling = true; const p = fn().catch(() => {}); state.polling = false; return p; }, ms)); }

function render() {
  clearTimers();
  const app = $("#app");
  if (!state.authed) { app.innerHTML = loginHTML(); wireLogin(); return; }
  app.innerHTML = `
  <header class="top"><div class="bar">
    <div class="brand"><img src="/admin/mark.svg" alt=""><span>Gola Bootlace <small>${esc(state.version)}</small></span></div>
    <nav aria-label="Pages">${views.map(([k, l]) => `<button data-v="${k}"${k === state.view ? ' aria-current="page"' : ""}>${l}</button>`).join("")}</nav>
    <div class="tools"><button class="icon" id="theme" title="Light or dark" aria-label="Switch between light and dark">◐</button><button class="icon" id="out" style="padding:0 12px;font-weight:600">Log out</button></div>
  </div></header>
  <main id="page" tabindex="-1"></main>
  <footer>Gola Bootlace, by <a href="https://gola.tn" target="_blank" rel="noopener">Gola Services</a>. Copyright (c) 2026 Gola Services SUARL. GPL-3.0-or-later.</footer>`;
  app.querySelectorAll("nav button").forEach(b => b.onclick = () => { state.view = b.dataset.v; location.hash = state.view; render(); });
  $("#theme").onclick = toggleTheme;
  $("#out").onclick = guard(async () => { await api("/api/logout", "POST", {}); state.authed = false; render(); });
  if (state.setupDone === undefined) { // the first-start guide is offered first, until it is finished or skipped
    state.setupDone = null;
    api("/api/setup").then(s => { state.setupDone = !!s.done; if (!s.done && !location.hash) state.view = "start"; render(); }).catch(() => { state.setupDone = true; });
  }
  if (state.setupDone === false && !views.some(v => v[0] === "start")) views.unshift(["start", "Start here"]);
  if (state.setupDone === true) { const i = views.findIndex(v => v[0] === "start"); if (i >= 0) views.splice(i, 1); }
  guard(({ start: pageStart, dash: pageDash, server: pageServer, library: pageLibrary, isos: pageISOs, answers: pageAnswers, pcs: pagePCs, menu: pageMenu, log: pageLog, account: pageAccount })[state.view])();
}

function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("bootlace-theme", next); } catch (e) { /* private window */ }
}
try { const t = localStorage.getItem("bootlace-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }

function loginHTML() {
  return `<div class="login card"><div class="brand"><img src="/admin/mark.svg" alt=""><span>Gola Bootlace</span></div>
  <form id="lf"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus required>
  <p class="hint">The first time, the server made the password and wrote it in its log: <code>journalctl -u bootlace | grep -i password</code> (or it was set with <code>-admin-password</code>).</p>
  <p class="err" id="lerr" role="alert"></p><button class="btn primary" style="width:100%">Log in</button></form></div>`;
}
function wireLogin() {
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const b = $("#lf button"); b.disabled = true;
    try { await api("/api/login", "POST", { password: $("#pw").value }); state.authed = true; render(); }
    catch (err) { $("#lerr").textContent = err.message; $("#pw").select(); }
    b.disabled = false;
  };
}

// ---- dashboard
async function loadCommon(request = api) {
  const isos = await request("/api/isos");
  state.isos = isos.isos || []; state.defaultAction = isos.default || "";
  const answers = await request("/api/answers");
  state.answers = answers.answers || []; state.answerKinds = answers.kinds || []; state.answersSameAddress = !!answers.sameAddress;
}
async function pageDash() {
  const page = $("#page");
  const { request: api, repeat: every, current } = viewScope(page);
  page.innerHTML = `<h1>Dashboard</h1><div id="dstats" class="grid stats"></div><div class="grid two" style="margin-top:14px"><div class="card"><h2>How PCs reach this server</h2><div id="facts" class="small"></div></div><div class="card"><h2>Start a PC from the network</h2>
  <ol class="steps"><li>Plug the PC into the same network (a cable: Wi‑Fi cannot network-boot).</li><li>If it has Secure Boot on, the Secure Boot route (Server page) lets it start; otherwise turn Secure Boot off in its firmware.</li><li>Start it and open the boot menu (F12, F8, F11 or Esc), pick the network entry (<em>UEFI: IPv4</em> / PXE).</li><li>The Gola Bootlace menu appears; pick an ISO.</li></ol></div></div>
  <div class="card" style="margin-top:14px"><h2>Recent activity</h2><div id="recent" class="small mono"></div></div>`;
  page.insertAdjacentHTML("afterbegin", `<div id="dbanner"></div>`);
  const draw = async () => {
    const [st, log, lib, svc, sbs] = await Promise.all([api("/api/status"), api("/api/log?limit=8"), api("/api/library"), api("/api/services"), api("/api/secureboot")]);
    $("#dbanner").innerHTML = serverBanner(lib.library, svc) + sbBanner(sbs, true);
    page.querySelectorAll("#dbanner [data-go]").forEach(a => a.onclick = e => { e.preventDefault(); state.view = a.dataset.go; location.hash = state.view; render(); });
    page.querySelectorAll("#dbanner [data-sb-on]").forEach(b => b.onclick = guard(async () => { await api("/api/secureboot", "PUT", { mode: "builtin" }); toast("Secure Boot route is on"); await draw(); }));
    $("#dstats").innerHTML = [[st.isoCount, "ISOs in the menu" + (st.isoHidden ? ` (${st.isoHidden} hidden)` : "")], [st.pcs, "PCs seen"], [bytes(st.isoBytes), "of ISOs"], [uptime(st.uptimeSeconds), "running"]]
      .map(([n, l]) => `<div class="card stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("");
    $("#facts").innerHTML = `<table>${st.facts.map(f => `<tr><td class="k">${esc(f.name)}</td><td class="mono">${esc(f.value)}</td></tr>`).join("")}<tr><td class="k">Library</td><td class="mono">${esc(st.isoDir || "(none chosen)")}</td></tr><tr><td class="k">Settings file</td><td class="mono">${esc(st.configFile)}</td></tr></table>`;
    $("#recent").innerHTML = (log.lines || []).length ? (log.lines || []).map(l => `<div>${esc(l.text)}</div>`).join("") : `<span class="muted">Nothing yet.</span>`;
  };
  await guard(draw)();
  if (!current()) return;
  every(4000, draw);
}

// ---- server: the library and the services
function modal(html) {
  const back = document.createElement("div"); back.className = "modal-back";
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const prev = document.activeElement;
  const onKey = e => { if (e.key === "Escape" && [...document.querySelectorAll(".modal-back")].pop() === back) close(); };
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey); if (prev && prev.focus) prev.focus(); };
  document.addEventListener("keydown", onKey);
  back.addEventListener("mousedown", e => { if (e.target === back) close(); });
  document.body.appendChild(back);
  const first = back.querySelector("input, button"); if (first) first.focus();
  return { el: back.firstElementChild, close };
}
// ask puts a question to the person and answers true or false
function ask(title, bodyHTML, yes) {
  return new Promise(resolve => {
    const m = modal(`<h2>${esc(title)}</h2><div class="small">${bodyHTML}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="no">Cancel</button><button class="btn primary" id="yes">${esc(yes)}</button></div>`);
    m.el.querySelector("#no").onclick = () => { m.close(); resolve(false); };
    m.el.querySelector("#yes").onclick = () => { m.close(); resolve(true); };
  });
}
function pcsText(list) { return `${list.length} PC${list.length > 1 ? "s are" : " is"} using the server right now (${esc(list.join(", "))})`; }

function serverBanner(lib, svc) {
  const r = svc.report, link = (t) => `<a href="#server" data-go="server">${t}</a>`;
  if (!lib.path) return `<div class="banner bad" role="status">No library is chosen, so the server is stopped. ${link("Choose the library folder")}.</div>`;
  if (r.blocked) return `<div class="banner bad" role="status">The server is stopped: ${esc(r.blocked)}. It starts again by itself when the library is back.</div>`;
  if (!r.wanted) return `<div class="banner" role="status">The server is stopped: PCs get no menu. ${link("Start it")}.</div>`;
  const failed = r.services.filter(s => s.state === "failed");
  if (failed.length) return `<div class="banner bad" role="status">${failed.map(f => esc(f.title + ": " + f.error)).join("<br>")}</div>`;
  return "";
}

// The Secure Boot route: a PC with UEFI Secure Boot on refuses iPXE, so without this route it stops at "Security Violation". This block says whether the route is on and whether its files are there.
const sbWays = [
  ["builtin", "Built in", "Works with the iPXE project's own shim (signed by Microsoft) and its signed iPXE, which are part of this program: nothing to download, no key to manage, nothing to enrol in any PC. It is the project's limited-feature iPXE build (iPXE leaves out the features that can start unsigned code, so Bootlace's own iPXE options are not in it), and a Linux ISO starts only if its distribution signed its kernel."],
  ["own", "Own key", "Your own signed iPXE and a distribution's shim, taken from a folder. Your key has to be enrolled once in every PC (MokManager, a few key presses at the PC). The iPXE is built by you with Bootlace's own options inside iPXE's Secure Boot limits; you look after the key and its revocation (SBAT)."],
  ["off", "Off", "No PC is sent through a shim. A PC with UEFI Secure Boot on stops with \"Security Violation\": switch Secure Boot off in that PC, or choose one of the other ways."],
];
const sbScopes = [["all", "Every 64-bit UEFI PC"], ["marked", "Only the PCs I mark"]];

// Where a setting came from, in a few words.
function sbSource(src, unset, option) {
  if (src === "option") return `Set by the command line or the environment (${option}): change it there and restart.`;
  if (src === "dashboard") return "Chosen here.";
  return unset ? "Not chosen yet: this installation is older than the built-in files, so it stays off until you choose." : "The default of a new installation. You can change it here.";
}

// The banner that offers the built-in route to an installation that has not chosen yet (also on the dashboard), or says that the built-in files are damaged.
function sbBanner(sb, withLink) {
  if (sb.mode === "builtin" && sb.problem) return `<div class="banner bad" role="status">${esc(sb.problem)}</div>`;
  if (!sb.unset) return "";
  return `<div class="banner" role="status">Secure Boot support is built in: turn it on. A PC with UEFI Secure Boot on cannot start the Bootlace menu until it is. <button class="btn small primary" data-sb-on>Turn it on</button>${withLink ? ` <a href="#server" data-go="server">Choose how</a>` : ""}</div>`;
}

// The Secure Boot route: a PC with UEFI Secure Boot on refuses iPXE, so without this route it stops at "Security Violation". This block chooses the way (the iPXE project's signed files built into
// the program, a key of your own, or none) and which PCs use it, and says whether the files are there.
function drawSecureBoot(sb, refresh) {
  const mode = sb.mode || "off", scope = sb.scope || "marked";
  const sent = scope === "all" ? "Every 64-bit UEFI PC" : `Only the PCs marked "Secure Boot route" on the PCs page (${sb.marked || 0} marked)`;
  const present = f => f.present ? `<span class="badge ok">${mode === "builtin" ? "built in" : "present"}</span>` : f.required ? `<span class="badge red">missing</span>` : `<span class="badge">not there</span>`;
  const fileRow = f => `<tr><td class="mono">${esc(f.name)}<div class="muted small">${esc(f.role)}</div></td><td class="small">${f.size ? bytes(f.size) : ""}${f.sha256 ? `<div class="mono muted" title="SHA-256 ${esc(f.sha256)}">${esc(f.sha256.slice(0, 16))}…</div>` : ""}</td><td>${present(f)}</td></tr>`;
  const b = sb.builtin || {};
  const seg = (name, legend, opts, value, locked, note) => `<fieldset class="seg"><legend>${legend}</legend><div class="opts">${opts.map(([v, t]) => `<label><input type="radio" name="${name}" value="${v}"${value === v ? " checked" : ""}${locked ? " disabled" : ""}><span>${esc(t)}</span></label>`).join("")}</div><p class="hint">${esc(note)}</p></fieldset>`;
  const detail = mode === "builtin"
    ? `<tr><td class="k">Built in</td><td class="small">the iPXE project's release <strong>${esc(b.release)}</strong> (${esc(b.released)}), x86-64, unchanged. Release archive: <a href="${esc(b.source)}" rel="noopener">ipxeboot.tar.gz</a>, SHA-256 <span class="mono">${esc(b.tarballSha256)}</span>${b.ok ? "" : ` <span class="badge red">does not match</span>`}</td></tr>`
    : mode === "own" ? `<tr><td class="k">Folder</td><td class="mono small">${esc(sb.dir)}${sb.own && sb.own.dirFromOption ? "" : `<div class="muted">(next to the settings file; give another with -secure-boot-dir)</div>`}</td></tr>` : "";
  $("#sbcard").innerHTML = `<h2>Secure Boot route ${sb.on ? (sb.ready ? `<span class="badge ok">on</span>` : `<span class="badge red">on, incomplete</span>`) : `<span class="badge">off</span>`}</h2>
    <p class="small muted">For PCs with UEFI Secure Boot on, which refuse iPXE (they stop with "Security Violation"). The PC is sent to a signed shim, which starts a signed iPXE. See docs/secure-boot.md.</p>
    ${sbBanner(sb, false)}
    ${seg("sbmode", "Way", sbWays.map(w => [w[0], w[1]]), mode, sb.modeLocked, sbSource(sb.modeSource, sb.unset, "-secure-boot, -secure-boot-dir or BOOTLACE_SECURE_BOOT"))}
    <ul class="small" style="margin:0 0 12px;padding-left:20px">${sbWays.map(w => `<li${w[0] === mode ? ` style="font-weight:600"` : ` class="muted"`}><strong>${esc(w[1])}.</strong> ${esc(w[2])}</li>`).join("")}</ul>
    ${seg("sbscope", "Which PCs", sbScopes, scope, sb.scopeLocked, sbSource(sb.scopeSource, false, "-secure-boot-scope, -secure-boot-all or BOOTLACE_SECURE_BOOT_SCOPE"))}
    ${mode === "off" ? "" : `<table class="rt"><tbody>${detail}<tr><td class="k">Sent through the shim</td><td>${esc(sent)}</td></tr></tbody></table>
      <table class="rt" style="margin-top:8px"><tbody>${(sb.files || []).map(fileRow).join("")}</tbody></table>`}
    ${mode !== "own" && sb.own && sb.own.problem ? `<p class="small muted" style="margin:10px 0 0">The own-key way is not set up yet, which does not matter while you use another way. It matters only if you choose "Own key": the folder (${esc(sb.own.dir)}) is not ready. ${esc(sb.own.problem)}</p>` : ""}
    <p class="${sb.problem ? "banner bad" : "small muted"}" style="${sb.problem ? "margin:10px 0 0" : "margin-bottom:0"}">${esc(sb.message || "")}</p>`;
  const card = $("#sbcard");
  const save = async body => { try { await api("/api/secureboot", "PUT", body); } catch (e) { refresh(); throw e; } toast("Saved"); refresh(); };
  const turnOn = card.querySelector("[data-sb-on]");
  if (turnOn) turnOn.onclick = guard(() => save({ mode: "builtin" }));
  card.querySelectorAll('input[name="sbmode"]').forEach(r => r.onchange = guard(async () => {
    if (!r.checked || r.value === mode) return;
    if (r.value === "own" && !await ask("Switch to your own key?", `PCs are then sent through a distribution's shim and the iPXE you signed, from <span class="mono">${esc(sb.own ? sb.own.dir : "")}</span>. <strong>Your key has to be enrolled in every PC first</strong> (a one-time step at the PC with MokManager, from a USB stick); a PC without it stops with a security error and does not reach the menu.${scope === "all" ? " With \"Every 64-bit UEFI PC\" that is every PC." : ""}`, "Switch to own key")) { refresh(); return; }
    await save({ mode: r.value });
  }));
  card.querySelectorAll('input[name="sbscope"]').forEach(r => r.onchange = guard(async () => {
    if (!r.checked || r.value === scope) return;
    if (r.value === "all" && !await ask("Send every 64-bit UEFI PC through the shim?", `Every 64-bit UEFI PC then starts the shim before iPXE, with Secure Boot on or off: one more boot stage for each. BIOS PCs and ARM64 PCs are not affected.${mode === "own" ? " <strong>With your own key, every one of those PCs needs the key enrolled</strong>, or it stops with a security error." : ""}`, "Send every PC")) { refresh(); return; }
    await save({ scope: r.value });
  }));
}

function drawServices(svc, refresh) {
  const r = svc.report;
  const badge = s => s.state === "running" ? `<span class="badge ok">running</span>` : s.state === "failed" ? `<span class="badge red">failed</span>` : `<span class="badge">stopped</span>`;
  const pcs = svc.sessions.length ? `<p class="small muted">${pcsText(svc.sessions)}.</p>` : "";
  $("#svccard").innerHTML = `<h2>Services</h2>
    <p class="small muted">What the PCs talk to. Stopping them stops the menu and everything else; this web page stays.</p>
    <table class="rt"><tbody>${r.services.map(s => `<tr><td>${esc(s.title)}<div class="muted small">${esc(s.detail)}${s.sessions.length ? ", " + s.sessions.length + " connected" : ""}</div>${s.error ? `<div class="small" style="color:var(--bad)">${esc(s.error)}</div>` : ""}</td><td>${badge(s)}</td></tr>`).join("")}</tbody></table>
    ${r.blocked ? `<p class="banner bad">${esc(r.blocked)}. The server starts by itself as soon as that is fixed.</p>` : ""}${pcs}
    <div class="row" style="margin-top:12px">${r.wanted ? `<button class="btn" id="stop">Stop the server</button>${r.services.some(s => s.state === "failed") ? `<button class="btn" id="start">Try the failed ones again</button>` : ""}` : `<button class="btn primary" id="start">Start the server</button>`}
    <label class="row small" style="margin:0 0 0 auto;font-weight:500"><span class="switch"><input type="checkbox" id="auto" ${svc.autoStart ? "checked" : ""} aria-label="Start the services when the program starts"><span></span></span> Start by itself when the program starts</label></div>`;
  const start = $("#start"), stop = $("#stop");
  if (start) start.onclick = guard(async () => { const d = await api("/api/services/start", "POST", {}); if (d.warning) toast(d.warning, true); else toast(r.wanted ? "Tried again" : "Started"); refresh(); });

// pickFolder is the folder picker: it shows folders only, and asks before a folder that is not a library yet becomes one.
function pickFolder(startPath, done) {
  const m = modal(`<h2>Choose the library folder</h2>
    <p class="muted small">It must be readable and writable: a folder on this computer, or a network drive that is mounted on it. Only folders are shown.</p>
    <div class="row"><button class="btn small" id="up">Up</button><input class="inline" type="text" id="path" aria-label="Folder" style="flex:1;min-width:160px"><button class="btn small" id="go">Go</button></div>
    <div class="dirs" id="dirs"></div><div class="small" id="info"></div><p class="err" id="perr" role="alert"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="use">Use this folder</button></div>`);
  const q = s => m.el.querySelector(s);
  let cur = "", parent = "";
  const load = async p => {
    q("#perr").textContent = "";
    try {
      const l = await api("/api/library/browse?path=" + encodeURIComponent(p));
      cur = l.path; parent = l.parent; q("#path").value = cur;
      q("#up").disabled = !cur;
      q("#dirs").innerHTML = l.dirs.length ? l.dirs.map((d, i) => `<button data-i="${i}"><span>${esc(d.name)}</span>${d.isLibrary ? `<span class="badge ok">library</span>` : ""}</button>`).join("") : `<div class="empty">No folders here.</div>`;
      q("#dirs").querySelectorAll("button").forEach(b => b.onclick = () => load(cur ? (cur.replace(/[\\/]$/, "") + (cur.includes("\\") ? "\\" : "/") + l.dirs[+b.dataset.i].name) : l.dirs[+b.dataset.i].name));
      q("#use").disabled = !cur;
      q("#info").textContent = "";
      if (cur) { const i = await api("/api/library/inspect?path=" + encodeURIComponent(cur)); q("#info").textContent = i.isLibrary ? "This folder is already a library." + (i.freeBytes ? ` ${bytes(i.freeBytes)} free.` : "") : (i.freeBytes ? `${bytes(i.freeBytes)} free on this disk.` : ""); }
    } catch (e) { q("#perr").textContent = e.message; }
  };
  const choose = async (create, force) => {
    try { await api("/api/library", "PUT", { path: cur, create, force }); m.close(); toast("Library set"); done(); }
    catch (e) {
      if (e.status === 409 && e.data && e.data.needsCreate) {
        if (await ask("Make this folder the library?", `Bootlace will add a hidden folder <code>.bootlace</code> inside <code>${esc(cur)}</code> and use the folder for the ISO files. Nothing else in it is changed.`, "Make it the library")) choose(true, force);
      } else if (e.status === 409 && e.data && e.data.sessions) {
        if (await ask("Change the library?", `${pcsText(e.data.sessions)}. The server restarts on the new folder and interrupts them.`, "Change anyway")) choose(create, true);
      } else q("#perr").textContent = e.message;
    }
  };
  q("#up").onclick = () => load(parent);
  q("#go").onclick = () => load(q("#path").value.trim());
  q("#path").onkeydown = e => { if (e.key === "Enter") load(q("#path").value.trim()); };
  q("#cancel").onclick = m.close;
  q("#use").onclick = () => choose(false, false);
  load(startPath || "");
}

// ---- library: the files, uploads, imports from a web address
const transfers = { uploads: [], jobs: [], queue: Promise.resolve(), refresh: null };

function when(iso) { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
function joinPath(a, b) { return a ? a + "/" + b : b; }
const reasonText = { name: "has the same name", source: "was imported from the same address", size: "has the same name and size", content: "has the same content (checksum)" };
function matchesHTML(ms) { return `<p>This looks like something that is already in the library:</p><ul>${ms.map(m => `<li><code>${esc(m.path)}</code> ${esc(reasonText[m.reason] || m.reason)}</li>`).join("")}</ul>`; }

async function pageLibrary() {
  const page = $("#page");
  const { request: api, repeat: every, current } = viewScope(page);
  page.innerHTML = `<div class="row" style="justify-content:space-between"><h1>Library</h1>
    <div class="row"><button class="btn primary" id="up">Upload files</button><button class="btn" id="imp">Add from a web address</button><button class="btn" id="mk">New folder</button></div></div>
    <input type="file" id="pick" multiple hidden>
    <div class="card" id="drop"><div id="crumbs" class="small" style="margin-bottom:8px"></div><div id="ltable" class="tablewrap"></div><div id="lfoot" class="small muted" style="margin-top:10px"></div></div>
    <div class="card" id="transfers" style="margin-top:14px" hidden></div>
    <div class="card" id="limitcard" style="margin-top:14px"></div>`;
  const draw = async () => {
    const [d, j] = await Promise.all([api("/api/library/files?path=" + encodeURIComponent(state.libPath || "")), api("/api/library/jobs")]);
    state.lib = d; transfers.jobs = j.jobs || [];
    drawFiles(d, j.hashing || d.hashing);
    renderTransfers();
    if (!$("#limitcard").dataset.done) drawLimit(d.limitMBps);
  };
  transfers.refresh = () => guard(draw)();
  const safeDraw = async () => {
    try { await draw(); }
    catch (e) { if (e === staleView) return; $("#ltable").innerHTML = `<div class="empty">${esc(e.message)}. <a href="#server" data-go="server">Open the Server page</a> to choose or fix the library.</div>`; $("#crumbs").innerHTML = ""; page.querySelectorAll("[data-go]").forEach(a => a.onclick = ev => { ev.preventDefault(); state.view = a.dataset.go; location.hash = state.view; render(); }); }
  };
  $("#up").onclick = () => uploadDialog();
  $("#pick").onchange = e => { [...e.target.files].forEach(queueUpload); e.target.value = ""; };
  $("#imp").onclick = () => importDialog();
  $("#mk").onclick = () => folderDialog();

  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.outline = "3px dashed var(--accent)"; }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.outline = ""; }));

// ---- transfers: what is being uploaded or imported
function renderTransfers() {
  const box = $("#transfers"); if (!box) return;
  const ups = transfers.uploads, jobs = transfers.jobs;
  box.hidden = !ups.length && !jobs.length;
  if (box.hidden) return;
  const prog = (done, total) => `<div class="bar2" role="progressbar" aria-valuenow="${total > 0 ? Math.round(100 * done / total) : 0}" aria-valuemin="0" aria-valuemax="100"><i style="width:${total > 0 ? Math.min(100, 100 * done / total) : 0}%"></i></div>`;
  const stateBadge = s => ({ done: `<span class="badge ok">done</span>`, failed: `<span class="badge red">failed</span>`, canceled: `<span class="badge">canceled</span>`, interrupted: `<span class="badge warn">stopped</span>`, queued: `<span class="badge">waiting</span>`, running: `<span class="badge ok">running</span>`, sending: `<span class="badge ok">sending</span>`, checking: `<span class="badge">checking</span>` })[s] || esc(s);
  const upRows = ups.map((u, i) => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between"><div><strong>${esc(u.name)}</strong> <span class="muted small">upload, ${bytes(u.size)}</span></div><div>${stateBadge(u.state)} ${u.state === "sending" ? `<button class="btn small" data-upcancel="${i}">Cancel</button>` : u.state !== "checking" ? `<button class="btn small" data-updismiss="${i}">Dismiss</button>` : ""}</div></div>
    ${u.state === "sending" ? prog(u.sent, u.size) + `<div class="small muted">${bytes(u.sent)} of ${bytes(u.size)}</div>` : ""}${u.error ? `<div class="small" style="color:var(--bad)">${esc(u.error)}</div>` : ""}${(u.warnings || []).map(w => `<div class="small" style="color:var(--warn)">${esc(w)}</div>`).join("")}</div>`).join("");
  const jobRows = jobs.slice().reverse().map(j => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between"><div><strong>${esc(j.dest)}</strong> <span class="muted small">from ${esc((() => { try { return new URL(j.url).host; } catch (e) { return j.url; } })())}</span></div>
    <div>${stateBadge(j.state)} ${j.state === "running" || j.state === "queued" ? `<button class="btn small" data-jc="${j.id}">Cancel</button>` : ""}${j.state === "interrupted" || j.state === "failed" ? `<button class="btn small" data-jr="${j.id}">Try again</button> <button class="btn small" data-jc="${j.id}">Remove</button>` : ""}${j.state === "done" || j.state === "canceled" ? `<button class="btn small" data-jd="${j.id}">Dismiss</button>` : ""}</div></div>
    ${j.state === "running" ? prog(j.done, j.size) + `<div class="small muted">${bytes(j.done)}${j.size > 0 ? " of " + bytes(j.size) : ""}${j.speed ? ", " + (j.speed / 1048576).toFixed(1) + " MB/s" : ""}</div>` : ""}${j.error ? `<div class="small" style="color:var(--bad)">${esc(j.error)}</div>` : ""}${(j.warnings || []).map(w => `<div class="small" style="color:var(--warn)">${esc(w)}</div>`).join("")}</div>`).join("");
  box.innerHTML = `<h2>Transfers</h2>${upRows}${jobRows}`;
  box.querySelectorAll("[data-upcancel]").forEach(b => b.onclick = () => { const u = transfers.uploads[+b.dataset.upcancel]; if (u && u.abort) u.abort(); else if (u && u.xhr) u.xhr.abort(); });
  box.querySelectorAll("[data-updismiss]").forEach(b => b.onclick = () => { transfers.uploads.splice(+b.dataset.updismiss, 1); renderTransfers(); });
  const jobCall = (attr, action) => box.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = guard(async () => { await api(`/api/library/jobs/${b.dataset[attr]}/${action}`, "POST", {}); transfers.refresh && transfers.refresh(); }));
  jobCall("jc", "cancel"); jobCall("jr", "resume"); jobCall("jd", "dismiss");
}

function queueUpload(file, sha) { transfers.queue = transfers.queue.then(() => uploadFile(file, state.libPath || "", sha)); }

async function uploadFile(file, folder, sha) {
  const item = { name: file.name, size: file.size, sent: 0, state: "checking", error: "", warnings: [] };
  transfers.uploads.push(item); renderTransfers();
  try {
    const chk = await api("/api/library/upload/check", "POST", { name: file.name, folder, size: file.size, sha256: sha || "" });
    if ((chk.problems || []).length) { item.state = "failed"; item.error = (chk.problems || []).join("; "); return; }
    if ((chk.matches || []).some(m => m.reason === "name")) { item.state = "failed"; item.error = "A file with this name is already in the library: rename or delete it first."; return; }
    if ((chk.matches || []).length && !await ask("Upload it anyway?", matchesHTML(chk.matches || []), "Upload anyway")) { item.state = "canceled"; return; }
    if (file.size >= PIECED_FROM) { await uploadInPieces(file, folder, sha, item); return; }
    await new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      item.xhr = xhr; item.state = "sending"; renderTransfers();
      xhr.open("PUT", "/api/library/upload?name=" + encodeURIComponent(file.name) + "&folder=" + encodeURIComponent(folder) + "&size=" + file.size + (sha ? "&sha256=" + encodeURIComponent(sha) : ""));
      xhr.setRequestHeader("X-Bootlace", "1");
      xhr.upload.onprogress = e => { item.sent = e.loaded; renderTransfers(); };
      xhr.onload = () => {
        let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) { /* no body */ }
        if (xhr.status === 200) { item.state = "done"; item.warnings = r.warnings || []; } else { item.state = "failed"; item.error = r.error || ("error " + xhr.status); }
        resolve();
      };
      xhr.onerror = () => { item.state = "failed"; item.error = "the connection was lost"; resolve(); };
      xhr.onabort = () => { item.state = "canceled"; resolve(); };
      xhr.send(file);
    });
  } catch (e) { item.state = "failed"; item.error = e.message; }
  finally { delete item.xhr; renderTransfers(); if (transfers.refresh) transfers.refresh(); }
}

// A big file is sent in pieces to an upload session on the server, so that a connection that breaks continues from what the server has (also after the page was reloaded:
// choose the same file again and it goes on). Smaller files are one request.
const PIECED_FROM = 64 << 20, PIECE = 8 << 20;
function sendPiece(id, offset, blob, item) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    item.xhr = xhr;
    xhr.open("PATCH", `/api/library/upload/sessions/${id}?offset=${offset}`);
    xhr.setRequestHeader("X-Bootlace", "1");
    xhr.upload.onprogress = e => { item.sent = offset + e.loaded; renderTransfers(); };
    xhr.onload = () => {
      let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) { /* no body */ }
      if (xhr.status === 200) resolve(r.received);
      else { const err = new Error(r.error || ("error " + xhr.status)); err.status = xhr.status; err.received = r.received; reject(err); }
    };
    xhr.onerror = () => { const err = new Error("the connection was lost"); err.status = 0; reject(err); };
    xhr.onabort = () => { const err = new Error("canceled"); err.status = -1; reject(err); };
    xhr.send(blob);
  });
}
async function uploadInPieces(file, folder, sha, item) {
  const s = await api("/api/library/upload/sessions", "POST", { name: file.name, folder, size: file.size, sha256: sha || "" });
  const url = "/api/library/upload/sessions/" + s.id;
  let received = s.received || 0, retries = 0, aborted = false;
  item.state = "sending"; item.sent = received; item.abort = () => { aborted = true; if (item.xhr) item.xhr.abort(); }; renderTransfers();
  const drop = async () => { try { await api(url, "DELETE"); } catch (e) { /* already gone */ } };
  while (received < file.size && !aborted) {
    try {
      received = await sendPiece(s.id, received, file.slice(received, Math.min(received + PIECE, file.size)), item);
      retries = 0;
    } catch (e) {
      if (aborted || e.status === -1) break;
      if (e.status === 409 && typeof e.received === "number") { received = e.received; item.sent = received; continue; } // go on from where the server has it
      const broken = e.status === 0 || e.status >= 500 || e.status === 429;
      if (!broken) { if (e.status !== 401) await drop(); throw e; } // refused for a reason: nothing to go on with
      if (++retries > 8) throw new Error("the connection keeps breaking: choose the same file again to go on from where it stopped");
      item.error = "the connection broke, trying again ..."; renderTransfers();
      await new Promise(r => setTimeout(r, Math.min(30000, 1000 * 2 ** retries)));
      try { received = (await api(url)).received; } catch (e2) { /* still down */ }
      item.error = "";
    }
  }
  if (aborted) { await drop(); item.state = "canceled"; return; }
  item.state = "checking"; item.sent = file.size; renderTransfers();       // (the server reads the whole file once to check it)
  const r = await api(url + "/finish", "POST", {});
  item.state = "done"; item.warnings = r.warnings || [];
}

function importDialog() {

async function deleteDialog(path, isDir) {
  const what = isDir ? `the folder <code>${esc(path)}</code> (only an empty folder can be deleted)` : `<code>${esc(path)}</code>`;
  if (!await ask("Delete?", `This deletes ${what} from the library for good. It cannot be undone.`, "Delete")) return;
  const go = guard(async (force) => {
    try { await api("/api/library/delete", "POST", { path, force: !!force }); toast("Deleted"); transfers.refresh && transfers.refresh(); }
    catch (e) {
      if (e.status === 409 && e.data && e.data.inUse) { if (await ask("A PC is using this", "A PC is reading this file right now. Deleting it makes that PC fail.", "Delete anyway")) go(true); }
      else throw e;
    }
  });

// ---- unattended installs: the answer file an ISO's installer is given (issue #17)
const answerFamilies = { "Debian installer": "preseed", "Ubuntu (casper)": "autoinstall", "Ubuntu-style (casper), by its boot menu": "autoinstall", "Red Hat family (installer)": "kickstart", "openSUSE": "autoyast", "Windows setup": "unattend" };
// plainNote is what to say about a file with a password in plain text: its address works without a login, so the network can read it (issue #60)
function plainNote(f) {
  const p = (f && f.plain) || [];
  return p.length ? `<p class="bad"><b>This file holds a password in plain text</b> (${esc(p.join("; "))}). An installer cannot log in, so any computer of the network that asks for the file reads the password. Put a hash there instead, or use the file only on a network you trust.</p>` : "";
}
function kindLabel(id) { const k = (state.answerKinds || []).find(x => x.id === id); return k ? k.label : id; }
function answerOptions(sel, first, withNone) {
  return `<option value=""${!sel ? " selected" : ""}>${esc(first)}</option>` + (withNone ? `<option value="none"${sel === "none" ? " selected" : ""}>No answer file for this PC</option>` : "") +
    (state.answers || []).map(a => `<option value="${esc(a.id)}"${sel === a.id ? " selected" : ""}>${esc(a.name)} (${esc(kindLabel(a.kind))})</option>`).join("");
}
function answerSelect(i) {
  if (!answerFamilies[i.family] && !i.answer) return ""; // only the installers that read an answer file
  if (!(state.answers || []).length && !i.answer) return "";
  const file = (state.answers || []).find(a => a.id === i.answer), want = answerFamilies[i.family];
  const hint = file && want && file.kind !== want ? `<div class="warn small">This is a ${esc(kindLabel(file.kind))}, but ${esc(i.family)} reads a ${esc(kindLabel(want))}: the installer will ignore it.</div>` : file ? `<div class="warn small">Every PC that starts this ISO from the menu installs without asking, and the file may erase its disks.</div>` : "";
  return `<div class="small" style="margin-top:6px"><label style="font-weight:500">Unattended install <select data-answer="${esc(i.id)}" aria-label="Answer file for ${esc(i.title)}">${answerOptions(i.answer || "", "None: the installer asks", false)}</select></label>${hint}</div>`;
}

  <p class="muted small">An answer file is what an installer reads so that it asks nothing: Debian's preseed, Ubuntu Server's autoinstall, Red Hat's kickstart, openSUSE's AutoYaST, Windows' autounattend.xml. Keep them here, then attach one to an ISO (on the ISOs page) or to one PC (Kernel options on the PCs page). Nothing is attached by itself, and the file <b>may erase disks</b>: only the PCs you chose install without asking. Inside a file, <code>{{hostname}}</code> (the name given to the PC, or <code>pc-</code> and the end of its address), <code>{{mac}}</code>, <code>{{ip}}</code> and <code>{{serial}}</code> are replaced for the PC that asks.</p>

      toast(on ? "Secure Boot route on: the next network boot of this PC goes through the shim" : "Secure Boot route off"); await draw();
    }));
    page.querySelectorAll("button[data-del]").forEach(b => b.onclick = guard(async () => { await api("/api/rules/" + encodeURIComponent(b.dataset.del), "DELETE"); toast("Rule removed"); await draw(); }));
    page.querySelectorAll("button[data-forget]").forEach(b => b.onclick = guard(async () => { await api("/api/pcs/" + encodeURIComponent(b.dataset.forget), "DELETE"); toast("Forgotten"); await draw(); }));
  };
  $("#psize").onchange = () => { view.size = parseInt($("#psize").value, 10); view.offset = 0; try { localStorage.setItem("bootlace-pcs-per-page", String(view.size)); } catch (e) { /* ignore */ } guard(draw)(); };
  let timer = null;
  $("#pq").oninput = () => { clearTimeout(timer); timer = setTimeout(() => { view.q = $("#pq").value.trim(); view.offset = 0; guard(draw)(); }, 250); };
  $("#rf").onsubmit = guard(async e => {
    e.preventDefault();
    await api("/api/rules", "POST", { mac: $("#rmac").value, action: $("#ract").value, note: $("#rnote").value });
    $("#rf").reset(); toast("Rule added"); await draw();
  });
  $("#cf").onsubmit = guard(async e => {
    e.preventDefault();
    const days = parseInt($("#cdays").value || "0", 10);
    if (!confirm(`Forget every PC not seen for ${days} day(s)?`)) return;
    const r = await api("/api/pcs/clean", "POST", { days }); toast(r.removed + " PC(s) forgotten"); await draw();
  });
  $("#af").onsubmit = guard(async e => {
    e.preventDefault();
    const s = await api("/api/settings"); await api("/api/settings", "PUT", { menuTimeout: s.menuTimeout, default: s.default, pcDays: parseInt($("#adays").value || "0", 10) }); toast("Saved"); await draw();
  });
  await guard(draw)();
  if (!current()) return;
  await guard(drawGroups)();
  if (!current()) return;
  every(5000, async () => { if (!$("#pctable").contains(document.activeElement) || document.activeElement === document.body) await draw(); }); // (not while a choice inside the table is being made: redrawing it would close it; the search box and the page size are outside it)
}

// ---- first-start guide
async function pageStart() {
  const page = $("#page");
  const { request: api, repeat: every, current } = viewScope(page);
  const [setup, st, acc] = await Promise.all([api("/api/setup"), api("/api/status"), api("/api/access")]);
  const fact = n => ((st.facts || []).find(f => f.name === n) || {}).value || "";
  const mark = ok => ok ? `<span class="ok" aria-label="done">&#10003;</span>` : `<span class="muted" aria-label="to do">&#9675;</span>`;
  const dhcp = fact("DHCP");
  page.innerHTML = `<h1>Welcome to Gola Bootlace</h1><p class="muted">Four short steps, and a PC that starts from the network gets your menu. Everything here is also on the normal pages; this list only goes through it once.</p>
  <div class="card" id="g1"><h2>${mark(setup.passwordChosen)} 1. Your own password</h2>
    ${setup.passwordChosen ? `<p class="small muted" style="margin:0">You set your own password.</p>` : `<p class="small muted">The password you logged in with was made up by the server at its first start and written in its log. Replace it with one you will remember.</p>
    <form id="gpf" class="grid two"><div class="field"><label for="gpc">The password you logged in with</label><input id="gpc" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="gpn">Your new password (8 characters or more)</label><input id="gpn" type="password" autocomplete="new-password" minlength="8" required></div>
    <div><button class="btn primary">Set my password</button></div></form>`}</div>
  <div class="card" id="g2" style="margin-top:14px"><h2>${mark(setup.library)} 2. The library</h2>
    <p class="small muted">The folder with your ISO files, on this computer or on a network drive that is mounted here. Bootlace adds a hidden <code>.bootlace</code> folder to it and nothing else.</p>
    ${setup.library ? `<p class="small" style="margin:0">The library is <code>${esc(setup.libraryPath)}</code>.</p>` : `<button class="btn primary" data-go="server">Choose the library</button>`}</div>
  <div class="card" id="g3" style="margin-top:14px"><h2>${mark(true)} 3. Who may use the server</h2>
    <p class="small muted">Addresses of the local network are always answered; every other address is refused${(acc.stats && acc.stats.networks.length) ? `, except ${acc.stats.networks.length} network(s) you added` : ""}${acc.stats && acc.stats.allowPublic ? ". <strong>Right now every address is answered.</strong>" : "."} The network disk and iSCSI have no login, so keep the server off the internet.</p>
    <button class="btn" data-go="server">Review it on the Server page</button></div>
  <div class="card" id="g4" style="margin-top:14px"><h2>${mark(false)} 4. Check that a PC will see the menu</h2>
    <p class="small muted">DHCP mode: <strong>${esc(dhcp || "?")}</strong>. ${dhcp === "proxy" ? "In proxy mode your network's own DHCP server gives addresses and Bootlace only answers PCs that start a network boot, so the router needs no change." : dhcp === "full" ? "In full mode Bootlace hands out addresses itself: only use it on a network without a DHCP server." : "Without DHCP the PCs have to be pointed at the server by hand."} The boot menu is at <code>${esc(fact("Boot menu"))}</code>.</p>
    <div class="row"><button class="btn" id="gcheck">Run the checks</button></div><div id="gout" aria-live="polite"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="gdone">Finish</button><button class="btn" id="gskip">Skip this guide</button></div>`;
  page.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { state.view = b.dataset.go; location.hash = state.view; render(); });
  const f = $("#gpf");
  if (f) f.onsubmit = guard(async e => { e.preventDefault(); await api("/api/password", "POST", { current: $("#gpc").value, new: $("#gpn").value }); toast("Password changed"); await pageStart(); });
  $("#gcheck").onclick = guard(async () => {
    const b = $("#gcheck"); b.disabled = true; b.textContent = "Checking ...";
    try {
      const [r, p] = await Promise.all([api("/api/selftest", "POST", {}).catch(e => ({ results: [], failed: 0, error: e.message })), api("/api/pxecheck", "POST", {}).catch(e => ({ result: { answers: [], error: e.message } }))]);
      if (!current()) return;
      const conflicts = ((p.result && p.result.answers) || []).filter(a => a.conflict).length;
      $("#gout").innerHTML = `<ul class="small" style="margin:10px 0 0;padding-left:18px">${(r.results || []).map(x => `<li>${x.status === "ok" ? "&#10003;" : x.status === "fail" ? "<strong class=\"bad\">&#10007;</strong>" : "&#8211;"} ${esc(x.title)}${x.status === "fail" ? ": " + esc(x.detail) + " <span class=\"muted\">" + esc(x.hint || "") + "</span>" : ""}</li>`).join("")}</ul>
        <p class="small ${r.failed || conflicts ? "bad" : "muted"}">${r.failed ? r.failed + " check(s) failed. " : ""}${conflicts ? conflicts + " other server(s) answer network boots too (Server page). " : ""}${!r.failed && !conflicts ? "All good. Start a PC from the network: it should show the Gola Bootlace menu." : ""}</p>`;
    } finally { b.disabled = false; b.textContent = "Run the checks"; }
  });
  const finish = guard(async () => { await api("/api/setup/finish", "POST", {}); state.setupDone = true; state.view = "dash"; location.hash = "dash"; render(); });
  $("#gdone").onclick = finish; $("#gskip").onclick = finish;
}

// ---- menu
async function pageMenu() {
  const page = $("#page");
  const { request: api, repeat: every, current } = viewScope(page);
  await guard(async () => { await loadCommon(api); state.settings = await api("/api/settings"); })();
  if (!current()) return;
  const s = state.settings || { menuTimeout: 0, default: "" };
  const legacy = s.default && !["local"].includes(s.default) && !s.default.startsWith("iso:");
  page.innerHTML = `<h1>Menu</h1><div class="grid two"><form class="card" id="mf">
    <div class="field"><label for="mo">Seconds before the choice below starts by itself</label><input id="mo" type="number" min="0" max="3600" value="${s.menuTimeout}"><p class="hint">0 means the menu waits for someone to choose, for ever.</p></div>
    <div class="field"><label for="md">What starts by itself</label><select id="md"><option value=""${!s.default ? " selected" : ""}>Nothing: wait for a choice</option>
      <option value="local"${s.default === "local" ? " selected" : ""}>Boot from the PC's own disk</option>
      ${state.isos.map(i => `<option value="iso:${i.id}"${s.default === "iso:" + i.id ? " selected" : ""}>${esc(i.title)}</option>`).join("")}
      ${legacy ? `<option value="${esc(s.default)}" selected>Set on the command line: ${esc(s.default)}</option>` : ""}</select>
      <p class="hint">Useful for a PC without a keyboard, and for PCs that restart in the middle of an installation: "own disk" lets them go on to the installed system.</p></div>
    <button class="btn primary">Save</button></form>
    <div class="card"><h2>What a PC sees</h2><p class="hint" style="margin-top:0">The Gola Bootlace logo is always shown on a UEFI PC; an older BIOS PC gets the same list as plain text.</p><div class="menu-preview" id="prev"></div><p class="hint">The menu is made again for every PC that starts, so a change applies at its next start.</p></div></div>`;
  const preview = () => {
    const d = $("#md").value, t = parseInt($("#mo").value || "0", 10);
    const items = state.isos.filter(i => !i.hidden).map(i => ({ k: "iso:" + i.id, t: i.title + (i.method === "recognised" ? "  [" + i.family + "]" : "  [as a disk]") }));
    items.push({ k: "local", t: "Boot from this PC's own disk" }, { k: "shell", t: "iPXE shell" }, { k: "reboot", t: "Restart this PC" });
    const sel = items.find(x => x.k === d) || items.find(x => x.k === "shell");
    $("#prev").innerHTML = `<div class="in"><div class="h">Choose what to start</div>` + items.map(x => `<div class="${x === sel ? "sel" : ""}">${esc(x.t)}</div>`).join("") + `<div style="margin-top:.8em;opacity:.8">${t > 0 && d ? "Starts the highlighted line after " + t + " s." : "Waits for a choice."}</div></div>`;
  };
  ["mo", "md"].forEach(id => $("#" + id).oninput = preview); preview();
  const tuning = await api("/api/tuning");
  page.insertAdjacentHTML("beforeend", `<form class="card" id="tf" style="margin-top:14px"><h2>Tuning</h2>
    <div class="field"><label for="hp">Keep these ISOs out of the menu</label><textarea id="hp" rows="4" spellcheck="false" placeholder="old/&#10;*beta*&#10;Backups/*">${esc((tuning.hidePatterns || []).join("\n"))}</textarea>
      <p class="hint">One pattern a line, compared with the path of the file in the library, without regard to case. <code>*</code> is any text and <code>?</code> one character: <code>old/</code> or <code>old/*</code> is everything in the folder old, <code>*beta*</code> any path with beta in it, <code>win11.iso</code> that one file. An ISO kept out this way is still listed on the ISOs page, marked "by a pattern".</p></div>
    <div class="grid two"><div class="field"><label for="tb">Largest TFTP block (bytes)</label><input id="tb" type="number" min="0" max="65464" value="${tuning.tftpBlockSize}"><p class="hint">0 follows what each PC asks for. Some switches and firmware only work with small blocks: try 1024 or 512 (at least 512) when a PC stops at the start of a download.</p></div>
    <div class="field"><label for="tw">TFTP blocks sent ahead (FreeBSD loader)</label><input id="tw" type="number" min="0" max="16" value="${tuning.tftpWindow}"><p class="hint">0 keeps the program's own number (4). 1 sends one block and waits, as the protocol says.</p></div></div>
    <div class="field"><label for="ta">Colour of the highlighted line</label><select id="ta"><option value="">Gola red (default)</option>${(tuning.accents || []).filter(c => c !== "red").map(c => `<option value="${c}"${tuning.menuAccent === c ? " selected" : ""}>${c[0].toUpperCase() + c.slice(1)}</option>`).join("")}</select><p class="hint">The chosen line and the section headings of the menu on a PC. A PC in UEFI mode shows the Gola Bootlace logo picture behind the menu; the colour of the line follows this choice when one other than the default is set.</p></div>
    <div class="field"><label>Windows 11 Setup: skip these checks</label>
      <div class="row small" style="gap:16px;flex-wrap:wrap">${[["tpm", "TPM 2.0"], ["secureBoot", "Secure Boot"], ["ram", "4 GB of memory"], ["cpu", "Supported processor"], ["storage", "64 GB of storage"]].map(([k, t]) => `<label class="row small" style="margin:0;font-weight:500"><input type="checkbox" data-sc="${k}" ${tuning.setupChecks && tuning.setupChecks[k] ? "checked" : ""}> ${t}</label>`).join("")}</div>
      <p class="hint">For installing Windows 11 on PCs that Microsoft does not list as supported (older PCs, virtual machines without a TPM). Windows then works there, but without a promise of updates or support from Microsoft. Applies to the Windows 11 ISOs started from the menu, at their next start. Nothing is skipped unless ticked. What was seen (Windows 11 26H2, a virtual machine with 2 GB of memory, no TPM and a 40 GB disk): without the TPM tick Setup stops with "This PC can't run Windows 11"; the memory and storage ticks changed nothing visible there (Setup went on without them, and its "52 GB or larger" note on the disk page shows either way), and the Secure Boot and processor ticks could not be tried on that machine.</p></div>
    <div class="field"><label>Windows Setup: more options</label>
      <div class="row small" style="gap:16px;flex-wrap:wrap">${[["localAccount", "Local account at the first start (no Microsoft account, no network needed)"], ["drivers", "Add the drivers of the library's drivers folder"]].map(([k, t]) => `<label class="row small" style="margin:0;font-weight:500"><input type="checkbox" data-sc="${k}" ${tuning.setupChecks && tuning.setupChecks[k] ? "checked" : ""}> ${t}</label>`).join("")}</div>
      <p class="hint"><b>Local account:</b> Windows 11 asks for a network and a Microsoft account at its first start. With this on, Bootlace gives Setup a small answer file that leaves those pages out: the first start then asks for a name and a password for a local account (seen working on 26H2 with no network at all; the installation pages are untouched and still asked). It is used only when no Windows answer file is attached to the PC or its ISO (put the same settings in your own file otherwise, see the documentation), and a PC set to "No answer file" does not get it.</p>
      <p class="hint"><b>Drivers:</b> driver packages (a folder per package with its .inf, .sys and .cat files) in <code>${esc(tuning.driversFolder || "drivers")}/all/</code> of the library are added to the copy of Windows' start-up image that this server hands out, loaded before Setup starts (so Setup sees a disk or a network card it does not know), and Setup puts them into the Windows it installs. Drivers for one ISO go in <code>${esc(tuning.driversFolder || "drivers")}/&lt;the ISO's file name without .iso&gt;/</code>. The ISO itself is never changed. The start-up image is held in the PC's memory: at most ${tuning.driverLimitMB || 1024} MB of drivers.
        ${(tuning.driverFolders || []).length ? `<br>Found in the library now: ${(tuning.driverFolders || []).map(f => `<code>${esc(f.name)}</code> (${f.packages} driver package${f.packages === 1 ? "" : "s"}, ${bytes(f.bytes)}${f.all ? ", every ISO" : ""})`).join("; ")}.` : "<br>Nothing found in the library yet."}</p></div>
    <button class="btn primary">Save</button></form>`);
  $("#tf").onsubmit = guard(async e => {
    e.preventDefault();
    await api("/api/tuning", "PUT", { hidePatterns: $("#hp").value.split("\n"), tftpBlockSize: parseInt($("#tb").value || "0", 10), tftpWindow: parseInt($("#tw").value || "0", 10), menuAccent: $("#ta").value, setupChecks: Object.fromEntries([...document.querySelectorAll("input[data-sc]")].map(i => [i.dataset.sc, i.checked])) });
    toast("Saved");
  });
  $("#mf").onsubmit = guard(async e => {
    e.preventDefault();
    await api("/api/settings", "PUT", { menuTimeout: parseInt($("#mo").value || "0", 10), default: $("#md").value });
    toast("Saved: the next PC to start gets it");
  });
}

// ---- log
async function pageLog() {
  const page = $("#page");
  const { request: api, repeat: every, current } = viewScope(page);
  page.innerHTML = `<div class="row" style="justify-content:space-between"><h1>Log</h1><div class="row"><label class="row small" style="margin:0;font-weight:500"><input type="checkbox" id="follow" checked> Follow</label><input id="flt" class="inline" type="text" placeholder="Filter" style="width:180px" aria-label="Filter the log"><a class="btn small" href="/api/log/download" download>Download the log</a></div></div><div class="log" id="logbox" tabindex="0" aria-label="Server log"></div>`;
  const box = $("#logbox");
  const kind = t => /dhcp:/.test(t) ? "dhcp" : /tftp:/.test(t) ? "tftp" : /smb:|share/.test(t) ? "smb" : /menu|rule/.test(t) ? "menu" : /web interface/.test(t) ? "web" : "";
  const paint = () => {
    const f = $("#flt").value.toLowerCase();
    box.innerHTML = state.logLines.filter(l => !f || l.text.toLowerCase().includes(f)).map(l => `<div class="k-${kind(l.text)}"><span class="t">${new Date(l.time).toLocaleTimeString()}</span>  ${esc(l.text)}</div>`).join("");
    if ($("#follow").checked) box.scrollTop = box.scrollHeight;
  };
  const poll = async () => {
    const r = await api("/api/log?after=" + state.logLast + "&limit=500");
    if (r.last < state.logLast) { state.logLines = []; state.logLast = 0; }
    if ((r.lines || []).length) { state.logLines = state.logLines.concat(r.lines).slice(-1000); state.logLast = r.last; paint(); }
  };
  $("#flt").oninput = paint; $("#follow").onchange = paint;
  state.logLines = []; state.logLast = 0;
  await guard(poll)();
  if (!current()) return;
  every(1500, poll);
}

// ---- account
function pageAccount() {
  const page = $("#page");
  const { request: api } = viewScope(page);
  page.innerHTML = `<h1>Account</h1><form class="card" id="pf" style="max-width:520px"><h2>Change the password</h2>
  <div class="field"><label for="p0">Current password</label><input id="p0" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><p class="hint">At least 8 characters. Other open sessions are logged out.</p></div>
  <div class="field"><label for="p2">New password again</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn primary">Change password</button></form>
  <p class="muted small" style="margin-top:14px">Anyone on the network can open this page, so keep the password to yourself. PCs that start from the network do not need it.</p>`;
  $("#pf").onsubmit = guard(async e => {
    e.preventDefault();
    if ($("#p1").value !== $("#p2").value) throw new Error("the two new passwords differ");
    await api("/api/password", "POST", { current: $("#p0").value, new: $("#p1").value });
    $("#pf").reset(); toast("Password changed");
  });
}

// ---- start
(async () => {
  const h = location.hash.slice(1);
  if (views.some(v => v[0] === h)) state.view = h;
  try { const s = await fetch("/api/session", { credentials: "same-origin" }).then(r => r.json()); state.authed = !!s.authenticated; state.version = s.version || ""; } catch (e) { state.authed = false; }
  render();
})();
</script>
</body>
