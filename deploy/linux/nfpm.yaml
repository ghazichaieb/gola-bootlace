# The Debian and RPM packages of Gola Bootlace: tools/package.sh runs nfpm on this file with VERSION, ARCH (amd64 or arm64) and BINARY (the built program) in the environment.
name: bootlace
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Gola Services <contact@gola.tn>
description: |
  Gola Bootlace, a network boot server for ISO files.
  Starts PCs from ISO files over the network (PXE and iPXE): Windows, Linux, rescue and
  installer ISOs from one folder, with a web interface. Answers next to the network's own
  DHCP server (proxy mode), so the router needs no change.
vendor: Gola Services SUARL
homepage: https://github.com/ghazichaieb/gola-bootlace
license: GPL-3.0-or-later
recommends:
  - wimtools
contents:
  - src: ${BINARY}
    dst: /usr/bin/bootlace
    file_info:
      mode: 0755
  - src: deploy/linux/bootlace.service
    dst: /lib/systemd/system/bootlace.service
    file_info:
      mode: 0644
  - src: deploy/linux/bootlace.default
    dst: /etc/default/bootlace
    type: config|noreplace
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/bootlace/README.md
    file_info:
      mode: 0644
  - src: CHANGELOG.md
    dst: /usr/share/doc/bootlace/CHANGELOG.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/bootlace/copyright
    file_info:
      mode: 0644
  - src: ADDITIONAL-TERMS.md
    dst: /usr/share/doc/bootlace/ADDITIONAL-TERMS.md
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/bootlace/NOTICE
    file_info:
      mode: 0644
scripts:
  postinstall: deploy/linux/postinst.sh
  preremove: deploy/linux/prerm.sh
